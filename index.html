<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var root = document.documentElement;
            var theme = null;
            try {
                theme = localStorage.getItem('theme');
            } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.dataset.theme = theme;
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab | luminousky.com</title>
    <link rel="icon" href="https://luminousky.com/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="https://luminousky.com/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['selector', '[data-theme="dark"]']
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");

        :root {
            color-scheme: light;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        /* First light: dawn sky hung behind the top of the page (same palette as luminousky.com).
           It runs past the hero and melts into the page, so the colors get room to breathe. */
        .page-sky {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 640px;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(to bottom,
                #9dbcf5 0%, #aebaf5 12%, #c2b8f4 26%, #d8bdea 38%,
                #f2c8dc 50%, #fbcbc6 59%, #ffcfb3 66%,
                #fdddca 76%, #fcede4 87%, #fbfbfd 100%);
            -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
        }
        @media (min-width: 768px) {
            .page-sky {
                height: 760px;
            }
        }

        .page-sky-sun {
            position: absolute;
            left: 50%;
            top: 40%;
            width: 90%;
            height: 40%;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(255, 184, 140, 0.8) 0%, rgba(255, 204, 170, 0.45) 35%, transparent 70%);
        }

        /* Before dawn: the same sky, an hour earlier */
        [data-theme="dark"] .page-sky {
            background: linear-gradient(to bottom,
                #0b1640 0%, #151b52 12%, #1c1f63 22%, #31206a 32%,
                #45226a 42%, #6a2a5e 54%, #7a2e55 62%,
                #6a2848 72%, #3e1630 83%, #150810 93%, #000000 100%);
        }

        [data-theme="dark"] .page-sky-sun {
            background: radial-gradient(ellipse at center, rgba(255, 140, 95, 0.55) 0%, rgba(215, 80, 115, 0.3) 35%, transparent 70%);
        }

        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Theme toggle: show the icon of the theme you would switch to */
        .theme-toggle .icon-sun {
            display: none;
        }
        [data-theme="dark"] .theme-toggle .icon-sun {
            display: inline-block;
        }
        [data-theme="dark"] .theme-toggle .icon-moon {
            display: none;
        }
    </style>
</head>
<body class="bg-[#fbfbfd] text-[#1d1d1f] dark:bg-black dark:text-[#f5f5f7] tracking-tight min-h-screen flex flex-col relative isolate">

<div class="page-sky" aria-hidden="true">
    <div class="page-sky-sun"></div>
</div>

<!-- ░░ HERO ░░ -->
<header class="relative pt-16 pb-12 md:pt-20 md:pb-16 flex flex-col items-center justify-center px-6 text-center overflow-hidden reveal">
    <button type="button" id="theme-toggle" aria-label="Switch to dark mode"
            class="theme-toggle absolute top-5 right-5 md:top-6 md:right-6 z-20 w-10 h-10 flex items-center justify-center rounded-full
                   border border-[#d2d2d7]/60 bg-white/40 backdrop-blur text-[#86868b] dark:text-[#a1a1a6] hover:text-[#1d1d1f] dark:hover:text-[#f5f5f7]
                   dark:border-[#333336]/60 dark:bg-[#1c1c1e]/40 dark:text-[#a1a1a6] dark:hover:text-[#f5f5f7]
                   transition-colors duration-300">
        <i class="icon-moon fa-solid fa-moon"></i>
        <i class="icon-sun fa-solid fa-sun"></i>
    </button>
    <div class="relative z-10 max-w-5xl mx-auto w-full">
        <h1 class="text-5xl sm:text-6xl md:text-7xl font-bold tracking-tighter leading-none text-[#1d1d1f] dark:text-[#f5f5f7]">
            Lab
        </h1>
    </div>
</header>

<!-- ░░ MAIN ░░ -->
<main class="flex-grow px-6 pb-16 md:pb-32 pt-6">
    <div class="max-w-7xl mx-auto">

        <div id="entries-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

        <div id="empty-state" class="hidden text-center py-24 reveal">
            <p class="text-lg font-medium text-[#86868b] dark:text-[#a1a1a6]">현재 등록된 실험이 없습니다.</p>
        </div>

    </div>
</main>

<!-- ░░ FOOTER ░░ -->
<footer class="py-10 bg-[#f5f5f7] dark:bg-[#0d0d0f] border-t border-black/[0.08] dark:border-[#333336]">
    <div class="max-w-7xl mx-auto px-6 flex flex-col items-center gap-4">

        <div class="flex items-center gap-5">
            <a href="https://luminousky.com"
               target="_blank" rel="noopener noreferrer"
               aria-label="luminousky.com"
               class="text-2xl text-[#86868b] dark:text-[#a1a1a6] hover:text-[#1d1d1f] dark:hover:text-[#f5f5f7] hover:-translate-y-px transition-all duration-200">
                <i class="fa-solid fa-globe"></i>
            </a>
            <a href="mailto:hello@luminousky.com"
               aria-label="hello@luminousky.com"
               class="text-2xl text-[#86868b] dark:text-[#a1a1a6] hover:text-[#1d1d1f] dark:hover:text-[#f5f5f7] hover:-translate-y-px transition-all duration-200">
                <i class="fa-solid fa-envelope"></i>
            </a>
            <a href="https://github.com/itmir913/lab"
               target="_blank" rel="noopener noreferrer"
               aria-label="GitHub Repository"
               class="text-2xl text-[#86868b] dark:text-[#a1a1a6] hover:text-[#1d1d1f] dark:hover:text-[#f5f5f7] hover:-translate-y-px transition-all duration-200">
                <i class="fa-brands fa-github"></i>
            </a>
        </div>

        <p class="text-base text-[#86868b] dark:text-[#a1a1a6]">
            &copy; 2026 luminousky.com. All rights reserved.
        </p>

    </div>
</footer>

<script>
    // manifest.json은 배포할 때 Actions가 만든다 (.github/scripts/build_manifest.py)
    const MANIFEST_URL = './manifest.json';

    function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
    }

    function createCard(entry, index) {
        return `
        <a href="./${encodeURIComponent(entry.path)}/"
           class="group flex items-center gap-4 bg-white dark:bg-[#1c1c1e] border border-black/[0.08] dark:border-[#333336] rounded-2xl px-6 py-5 no-underline
                  hover:bg-[#f5f5f7] hover:border-black/[0.12] dark:hover:bg-[#2c2c2e] dark:hover:border-[#48484a]
                  transition-colors duration-300 reveal"
           style="transition-delay:${index * 60}ms">
            <i class="fa-solid fa-flask text-xl text-[#86868b] dark:text-[#a1a1a6] group-hover:text-[#1d1d1f] dark:group-hover:text-[#f5f5f7] transition-colors duration-300"></i>
            <h2 class="flex-1 min-w-0 text-lg font-semibold text-[#1d1d1f] dark:text-[#f5f5f7] leading-snug break-keep">
                ${escapeHtml(entry.title)}
            </h2>
            <i class="fa-solid fa-arrow-right text-base text-[#86868b] dark:text-[#a1a1a6]
                      opacity-0 -translate-x-1
                      group-hover:opacity-100 group-hover:translate-x-0
                      transition-all duration-200"></i>
        </a>`;
    }

    function renderSkeleton() {
        const container = document.getElementById('entries-container');
        container.innerHTML = Array.from({ length: 4 }, () => `
            <div class="h-[70px] rounded-2xl bg-white/60 dark:bg-[#1c1c1e]/60 border border-black/[0.06] dark:border-[#333336] animate-pulse"></div>`
        ).join('');
    }

    function renderEntries(entries) {
        const container = document.getElementById('entries-container');
        const empty = document.getElementById('empty-state');

        if (!entries.length) {
            container.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }

        container.innerHTML = entries.map((entry, i) => createCard(entry, i)).join('');
    }

    async function loadEntries() {
        try {
            const res = await fetch(MANIFEST_URL, { cache: 'no-cache' });
            if (!res.ok) return [];
            const data = await res.json();
            return Array.isArray(data) ? data : [];
        } catch (e) {
            return [];
        }
    }

    function initReveals() {
        const observer = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
        }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    function initThemeToggle() {
        const root = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        const syncLabel = () => {
            toggle.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        };
        syncLabel();
        toggle.addEventListener('click', () => {
            root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
            try {
                localStorage.setItem('theme', root.dataset.theme);
            } catch (e) {}
            syncLabel();
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
        initThemeToggle();
        renderSkeleton();
        document.querySelectorAll('header.reveal').forEach(el => el.classList.add('active'));

        renderEntries(await loadEntries());

        setTimeout(initReveals, 50);
    });
</script>
</body>
</html>
